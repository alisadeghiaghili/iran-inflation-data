[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-inflation-data"
version = "1.0.0"
description = "Python package to fetch and export Iran inflation data for prediction and analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ali Sadeghi", email = "alisadeghiaghili@gmail.com"}
]
keywords = ["iran", "inflation", "cpi", "world-bank", "imf", "data", "prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Database",
]
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.0.10", "xlsxwriter>=3.0.0"]
sql = ["sqlalchemy>=1.4.0", "pyodbc>=4.0.35"]
scraping = ["beautifulsoup4>=4.12.0", "lxml>=4.9.0"]
worldbank = ["wbgapi>=1.0.14"]
imf = ["sdmx1>=2.22.0"]
cbi = ["playwright>=1.40.0"]
all = [
    "openpyxl>=3.0.10",
    "xlsxwriter>=3.0.0",
    "sqlalchemy>=1.4.0",
    "pyodbc>=4.0.35",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "wbgapi>=1.0.14",
    "sdmx1>=2.22.0",
    "playwright>=1.40.0",
]
dev = ["pytest>=7.0", "black", "flake8", "mypy", "build"]

[project.scripts]
iran-inflation = "iran_inflation.cli:main"

[project.urls]
Homepage = "https://github.com/alisadeghiaghili/iran-inflation-data"
Repository = "https://github.com/alisadeghiaghili/iran-inflation-data"
Issues = "https://github.com/alisadeghiaghili/iran-inflation-data/issues"

[tool.setuptools.packages.find]
include = ["iran_inflation*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
